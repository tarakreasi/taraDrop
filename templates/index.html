<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>taraDrop</title>
    <style>
        :root {
            /* Palette */
            --ios-blue: #007AFF;
            --ios-blue-light: #5AC8FA;
            --ios-orange: #FF9500;
            --ios-gray: #8E8E93;

            /* Glassmorphism Variables */
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shine: rgba(255, 255, 255, 0.4);

            --primary-color: var(--ios-blue);
            --accent-color: var(--ios-orange);

            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-stack);
            /* Cool, airy mesh gradient (Blue dominant) */
            background-color: #F0F4F8;
            background-image:
                radial-gradient(at 0% 0%, hsla(210, 100%, 93%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(190, 100%, 88%, 1) 0, transparent 50%),
                radial-gradient(at 100% 100%, hsla(220, 100%, 90%, 1) 0, transparent 50%),
                radial-gradient(at 0% 100%, hsla(200, 100%, 92%, 1) 0, transparent 50%);
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: #1c1c1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        /* Enhanced Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow:
                0 20px 40px -12px rgba(0, 50, 150, 0.08),
                inset 0 1px 1px 0 var(--glass-shine);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
            /* Dark Blue-Black Text */
            color: #1c1c1e;
            background: -webkit-linear-gradient(135deg, #1c1c1e 0%, #3a3a3c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(60, 60, 67, 0.6);
            margin-bottom: 2.5rem;
            font-weight: 500;
        }

        /* Drop Zone - Blue Theme with subtle Orange hover hint */
        .drop-zone {
            background: rgba(255, 255, 255, 0.4);
            border: 2px dashed rgba(60, 60, 67, 0.15);
            border-radius: 20px;
            padding: 2.5rem 1rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            background: rgba(255, 255, 255, 0.6);
            border-color: var(--primary-color);
            /* Blue Border on hover */
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(0, 122, 255, 0.15);
        }

        /* Icon: Orange Accent here is nice and subtle */
        .icon-cloud {
            width: 64px;
            height: 64px;
            color: var(--accent-color);
            /* Orange Cloud */
            margin-bottom: 1rem;
            filter: drop-shadow(0 8px 16px rgba(255, 149, 0, 0.2));
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .drop-zone:hover .icon-cloud {
            transform: scale(1.1) translateY(-4px);
        }

        .drop-text-main {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1c1c1e;
            margin-bottom: 0.25rem;
        }

        .drop-text-sub {
            font-size: 0.9rem;
            color: rgba(60, 60, 67, 0.6);
        }

        input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Primary Button: Blue (Main Action) */
        .btn-ios {
            background: var(--primary-color);
            /* Blue */
            color: white;
            border: none;
            padding: 1.1rem;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3);
        }

        .btn-ios:hover {
            box-shadow: 0 12px 25px rgba(0, 122, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn-ios:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        /* Progress Bar */
        #progress-container {
            display: none;
            margin-top: 2rem;
            text-align: left;
        }

        .progress-track {
            background: rgba(60, 60, 67, 0.1);
            border-radius: 100px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        /* Progress Fill: Blue */
        .progress-fill {
            background: var(--primary-color);
            height: 100%;
            width: 0%;
            border-radius: 100px;
            transition: width 0.3s ease-out;
            box-shadow: 0 0 12px rgba(0, 122, 255, 0.5);
        }

        .status-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            color: #3a3a3c;
            margin-bottom: 6px;
        }

        /* Warning: Orange tint instead of Red for less alarm? Or stick to standard?
           Let's use subtle Orange/Yellow pill for "Attention" */
        .warning-pill {
            background: rgba(255, 149, 0, 0.1);
            /* Orange Tint */
            border: 1px solid rgba(255, 149, 0, 0.2);
            color: #D67E00;
            /* Darker Orange text */
            padding: 0.75rem;
            border-radius: 14px;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
        }

        .success-text {
            color: #34C759;
            /* iOS Green */
            font-weight: 700;
            text-align: center;
            margin-top: 1rem;
            font-size: 1.2rem;
        }

        /* Footer */
        .footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: rgba(60, 60, 67, 0.5);
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .footer span {
            display: block;
            margin-top: 0.25rem;
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="glass-card">
        <h1>taraDrop</h1>
        <div class="subtitle">Quick Share</div>

        <form id="uploadForm" enctype="multipart/form-data">
            <div id="dropZone" class="drop-zone">
                <input type="file" name="file" id="fileInput" required>
                <!-- Orange Accent Icon -->
                <svg class="icon-cloud" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z" />
                </svg>
                <div class="drop-text-main">Tap to Share</div>
                <div class="drop-text-sub" id="fileNameDisplay">or drag files here</div>
            </div>

            <!-- Blue Primary Button -->
            <button type="submit" id="submitBtn" class="btn-ios">Send File</button>
        </form>

        <div id="progress-container">
            <div class="status-text">
                <span id="statusMsg">Sending...</span>
                <span id="statusPercent">0%</span>
            </div>
            <div class="progress-track">
                <div id="progress-bar" class="progress-fill"></div>
            </div>
            <div class="warning-pill">
                <!-- Warning Icon -->
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                Keep screen active
            </div>
        </div>
    </div>

    <div class="footer">
        tarakreasi.com
        <span>kreasi bermakna</span>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const dropZone = document.getElementById('dropZone');
        const form = document.getElementById('uploadForm');

        // Drag/Drop FX
        ['dragenter', 'dragover'].forEach(evt => {
            dropZone.addEventListener(evt, () => dropZone.classList.add('dragover'), false)
        });
        ['dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, () => dropZone.classList.remove('dragover'), false)
        });

        // File Selection
        fileInput.addEventListener('change', function () {
            if (this.files && this.files.length > 0) {
                fileNameDisplay.textContent = this.files[0].name;
                fileNameDisplay.style.color = '#1c1c1e';
            }
        });

        // Upload
        form.onsubmit = async function (e) {
            e.preventDefault();
            if (fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            const chunkSize = 1 * 1024 * 1024;
            const totalChunks = Math.ceil(file.size / chunkSize);
            const filename = file.name;

            // Animate UI
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('dropZone').style.display = 'none';
            document.getElementById('progress-container').style.display = 'block';

            for (let i = 0; i < totalChunks; i++) {
                const start = i * chunkSize;
                const end = Math.min(start + chunkSize, file.size);
                const chunk = file.slice(start, end);
                const formData = new FormData();

                formData.append('file', chunk);
                formData.append('filename', filename);
                formData.append('chunkIndex', i);

                try {
                    await uploadChunk(formData);
                    const percent = Math.round(((i + 1) / totalChunks) * 100);
                    updateProgress(percent);
                } catch (error) {
                    i--; // Retry
                    await new Promise(r => setTimeout(r, 1000));
                }
            }

            // Finish
            document.querySelector('.warning-pill').style.display = 'none';
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.innerHTML = '<span class="success-text">Sent Successfully!</span>';
            statusMsg.style.justifyContent = 'center';
            document.getElementById('statusPercent').style.display = 'none';
            document.getElementById('progress-bar').style.backgroundColor = '#34C759'; // Success Green

            setTimeout(() => location.reload(), 3000);
        };

        function updateProgress(percent) {
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('statusPercent').textContent = percent + '%';
        }

        function uploadChunk(data) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/upload_chunk', true);
                xhr.onload = () => xhr.status === 200 ? resolve() : reject();
                xhr.onerror = () => reject();
                xhr.send(data);
            });
        }
    </script>
</body>

</html>
